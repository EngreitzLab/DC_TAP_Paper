# Paths are relative to the CRISPR_comparison pipeline directory. Copy in:
#   resources/e2g_predictions/ENCFF*.bed.gz  ENCODE-rE2G and ABC predictions (crispr_benchmarking/download_encode_e2g_predictions.sh)
#   resources/EPBenchmark_*.tsv.gz           crispr_benchmarking/EPBenchmark_DC_TAPseq_randomElementGenePairs_0.8pwrAt25effect.tsv.gz
#   resources/e2g_predictions/correlation_*  DNase-expression correlation baseline; not deposited
comparisons:
  DC_TAPseq:
    pred:
      ABCdnase:
        ["resources/e2g_predictions/ENCFF681DDZ.bed.gz",
         "resources/e2g_predictions/ENCFF660VQW.bed.gz"]
      ENCODE_rE2G:
        ["resources/e2g_predictions/ENCFF970QAX.bed.gz",
         "resources/e2g_predictions/ENCFF071ZZU.bed.gz"]
      correlation_k562_dnase:
        ["resources/e2g_predictions/correlation_K562_ENCSR000EOT_full_predictions.tsv.gz",
         "resources/e2g_predictions/correlation_WTC11_ENCSR785ZUI_full_predictions.tsv.gz"]
    expt: "resources/EPBenchmark_DC_TAPseq_randomElementGenePairs_0.8pwrAt25effect.tsv.gz"
    gene_universe: "resources/genome_annotations/CollapsedGeneBounds.hg38.bed"
    tss_universe: "resources/genome_annotations/CollapsedGeneBounds.hg38.TSS500bp.bed"
    pred_config: "config/predictor_config_files/benchmarking_pred_config_with_alpha.tsv"
    include_col: "crispr_main_benchmarks"
    cell_type_mapping:
      ABCdnase: "config/cell_type_mappings/ABCdnase_cell_type_mapping.txt"
      ENCODE_rE2G: "config/cell_type_mappings/ENCODE-rE2G_cell_type_mapping.txt"
      EpiMap: "config/cell_type_mappings/EpiMap_cell_type_mapping.txt"
      correlation_k562_dnase: "config/cell_type_mappings/ABCdnase_cell_type_mapping.txt"
    dist_bins_kb: [0, 10, 100, 1500]
    expressed_genes: "resources/genomic_features/expressed_genes_all_cell_types.tsv"
